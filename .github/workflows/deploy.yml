name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sanity check — secrets present
        env:
          HAVE_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          KEY_LEN: ${{ secrets.DEPLOY_SSH_KEY != '' && 'set' || 'EMPTY' }}
          HOST_LEN: ${{ secrets.DEPLOY_HOST != '' && 'set' || 'EMPTY' }}
        run: |
          echo "DEPLOY_SSH_KEY: $KEY_LEN"
          echo "DEPLOY_HOST:    $HOST_LEN"
          if [ "$HAVE_KEY" != "true" ] || [ "$HAVE_HOST" != "true" ]; then
            echo "::error::One or both secrets are missing in repository Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519 || (echo "::error::Private key file is not a valid SSH key — DEPLOY_SSH_KEY secret probably lost its newlines on paste." && exit 1)

      - name: Deploy
        env:
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Trim whitespace/newlines that may have snuck in during paste
          # into the GitHub Secret UI — ssh refuses "invalid characters"
          # otherwise.
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST_RAW" | tr -d '[:space:]')"
          echo "Deploying to: [$DEPLOY_HOST]"
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              forge@"$DEPLOY_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          cd /home/forge/art-db.org
          git pull origin main
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          EOSSH
